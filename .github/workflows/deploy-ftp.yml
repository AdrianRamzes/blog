# Wysyła katalog public/ na serwer (Hostinger) przez FTP po każdej zmianie na master.
# Używa tego samego skryptu co lokalnie: sync-ftp.py.
# Wymaga sekretów w GitHub: Settings → Secrets and variables → Actions:
#   FTP_HOST, FTP_USER, FTP_PASS  (te same wartości co w .env.ftp)
name: Deploy to karalus.eu

on:
  push:
    branches: [master]
    paths:
      - "public/**"
      - "sync-ftp.py"
      - ".github/workflows/deploy-ftp.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync public/ over FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        # Skrypt pyta "Proceed with sync? [y/N]" — tu odpowiadamy automatycznie.
        run: echo y | python3 sync-ftp.py
